name: Refresh Active Challenges

on:
  schedule:
    # Runs daily at 00:05 UTC — just after midnight so daily challenges
    # always have the correct expiry for the new day.
    - cron: '5 0 * * *'
  # Allow manual trigger from the GitHub Actions UI.
  workflow_dispatch:

# Phase 0.9 guardrail: this cron had no failure alerting and no confirmed
# path to a human (same silent-cron risk flagged for pg_cron/backups in
# Audit §3.9) — a broken daily rotation would run stale/duplicate
# challenges indefinitely with nobody knowing until a user noticed. The
# on-failure step below needs `issues: write` to file/update a tracking
# issue using the default GITHUB_TOKEN — no new secret required.
permissions:
  issues: write

jobs:
  refresh:
    name: Rotate challenge pool
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call refresh-challenges edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "${SUPABASE_URL}/functions/v1/refresh-challenges" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "Response: $response"

          # Fail the job if ok is not true
          ok=$(echo "$response" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            echo "Challenge refresh returned an error."
            exit 1
          fi

      # Don't rely on GitHub's default "workflow failed" email actually
      # reaching anyone (unconfirmed — the exact gap this step closes).
      # File or update a single tracking issue instead, so a failure is
      # visible in the repo itself regardless of anyone's email/notification
      # settings. Re-uses one issue across repeat failures rather than
      # opening a new one every day the cron stays broken.
      - name: Open/update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Challenge refresh cron is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The \`refresh-challenges\` workflow failed on ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'The daily challenge pool did not rotate for this run. If this stays open across multiple days, active challenges are stale/duplicated for users.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cron-failure',
            });

            const match = existing.data.find((issue) => issue.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cron-failure'],
              });
            }
