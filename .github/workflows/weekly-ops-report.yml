name: Weekly Ops Report

on:
  schedule:
    # Runs Monday 13:00 UTC (~9am ET) — the last 7 days of activity.
    - cron: '0 13 * * 1'
  # Allow manual trigger from the GitHub Actions UI.
  workflow_dispatch:

# Same silent-cron guardrail as refresh-challenges.yml (Phase 0.9) — a
# broken weekly report should surface somewhere a human will see it,
# not fail quietly into nobody's inbox.
permissions:
  issues: write

jobs:
  report:
    name: Generate and post weekly ops report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call weekly-ops-report edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "${SUPABASE_URL}/functions/v1/weekly-ops-report" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json")

          echo "Response: $response"

          ok=$(echo "$response" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            echo "Weekly ops report failed or Slack post failed."
            exit 1
          fi

      - name: Open/update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Weekly ops report cron is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The \`weekly-ops-report\` workflow failed on ${new Date().toISOString()}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'No weekly report was posted to Slack for this run.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cron-failure',
            });

            const match = existing.data.find((issue) => issue.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cron-failure'],
              });
            }
